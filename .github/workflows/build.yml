name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            goos: linux
            goarch: amd64
          - os: windows-latest
            target: windows
            goos: windows
            goarch: amd64
          - os: macos-13
            target: macos
            goos: darwin
            goarch: amd64
          - os: macos-latest
            target: macos-arm64
            goos: darwin
            goarch: arm64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Linux: system dependencies
      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libgtk-3-0 patchelf

      # Windows: WebView2 (pre-installed on GitHub runners)
      # No extra steps needed Windows runners include WebView2 headers.

      # macOS: Xcode (pre-installed on GitHub runners)
      # No extra steps needed macOS runners include Xcode CLI tools.

      # Extract version from tag (falls back to 0.0.0 for manual runs)
      - name: Set version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VERSION="0.0.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Install Wails CLI
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # Stage the app icon where wails expects it, build/appicon.png.
      # Wails derives icon.icns from it at build time.
      - name: Stage app icon
        run: |
          mkdir -p build/windows
          cp packaging/icon.ico build/windows/icon.ico

      # Build
      # wails build handles: go mod tidy, frontend:install, frontend:build
      # No -platform flag: each job runs on its native OS, Wails auto-detects.
      - name: Build binary
        run: wails build

      # Upload artifacts
      - name: Upload Linux binary
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: glean-linux-amd64
          path: build/bin/glean
          if-no-files-found: error

      - name: Upload Windows binary
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: glean-windows-amd64
          path: build/bin/glean.exe
          if-no-files-found: error

      - name: Upload macOS binary
        if: matrix.target == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: glean-macos-amd64
          path: build/bin/glean.app
          if-no-files-found: error

      - name: Upload macOS ARM64 binary
        if: matrix.target == 'macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: glean-macos-arm64
          path: build/bin/glean.app
          if-no-files-found: error

      # Linux AppImage: wrap the binary so the release page carries a
      # single runnable file. GTK and webkit2gtk stay system dependencies.
      - name: Build Linux AppImage
        if: matrix.target == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -ex
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/bin/glean AppDir/usr/bin/glean
          cp packaging/linux/glean.desktop AppDir/glean.desktop
          # Convert .ico to .png for the AppImage icon
          python3 packaging/linux/ico-to-png.py packaging/icon.ico AppDir/glean.png
          cp AppDir/glean.png AppDir/usr/share/icons/hicolor/256x256/apps/glean.png
          wget --tries=3 --waitretry=5 https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          export LDAI_OUTPUT=glean.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

      # Windows installer: compile the C# installer + uninstaller
      - name: Build Windows installer
        if: matrix.target == 'windows'
        run: |
          cmd /c "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /target:winexe /win32icon:packaging\icon.ico /reference:C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF\PresentationFramework.dll /reference:C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF\PresentationCore.dll /reference:C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF\WindowsBase.dll /reference:C:\Windows\Microsoft.NET\Framework64\v4.0.30319\System.Xaml.dll /out:build\bin\gleanInstaller.exe installer\Installer.cs"
          cmd /c "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /target:winexe /win32icon:packaging\icon.ico /reference:C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF\PresentationFramework.dll /reference:C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF\PresentationCore.dll /reference:C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF\WindowsBase.dll /reference:C:\Windows\Microsoft.NET\Framework64\v4.0.30319\System.Xaml.dll /out:build\bin\gleanUninstaller.exe installer\Uninstaller.cs"

      # Generate release body: commit message + changelog with clickable hashes.
      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | head -2 | tail -1)
          REPO_URL=$(git remote get-url origin | sed 's/\.git$//')
          # Commit message body (skip first line = title)
          BODY=$(git log -1 --pretty=format:'%b' HEAD | sed '/^$/d')
          # Changelog with clickable hashes
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:'- [%%h]($REPO_URL/commit/%%h) %%s' ${PREV_TAG}..HEAD)
          else
            LOG=$(git log --pretty=format:'- [%%h]($REPO_URL/commit/%%h) %%s')
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          if [ -n "$BODY" ]; then
            echo "$BODY" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
          fi
          echo "## Changelog" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      # Publish straight to the GitHub Release when this run came from a
      # tag push.
      - name: Package macOS app bundle
        if: matrix.target == 'macos' || matrix.target == 'macos-arm64'
        run: |
          cd build/bin
          ARCH="${{ matrix.target == 'macos-arm64' && 'arm64' || 'x86_64' }}"
          zip -r "../../glean-${ARCH}.app.zip" glean.app

      - name: Publish Linux to Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'linux'
        uses: softprops/action-gh-release@v2
        with:
          files: glean.AppImage
          body: ${{ steps.changelog.outputs.body }}

      - name: Publish Windows to Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'windows'
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/gleanInstaller.exe
          body: ${{ steps.changelog.outputs.body }}

      - name: Publish macOS to Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'macos'
        uses: softprops/action-gh-release@v2
        with:
          files: glean-x86_64.app.zip
          body: ${{ steps.changelog.outputs.body }}

      - name: Publish macOS ARM64 to Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.target == 'macos-arm64'
        uses: softprops/action-gh-release@v2
        with:
          files: glean-arm64.app.zip
          body: ${{ steps.changelog.outputs.body }}
