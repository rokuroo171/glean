<div id="editor"></div>
<script type="module">

const theme = EditorView.theme({
  '&': { color: '#e8eaed', backgroundColor: 'transparent', height: '100%', fontSize: '14px' },
  '.cm-content': { fontFamily: 'inherit', lineHeight: '1.6', padding: '12px 16px', caretColor: '#e8eaed' },
  '.cm-scroller': { fontFamily: 'inherit', overflow: 'auto' },
  '&.cm-focused': { outline: 'none' },
  '.cm-cursor': { borderLeftColor: '#e8eaed' },
  '.cm-selectionBackground, &.cm-focused .cm-selectionBackground': { background: 'rgba(91,159,212,0.28)' },
  '.cm-activeLine': { background: 'rgba(180,140,80,0.05)' },
  '.glean-hide': { fontSize: 0, pointerEvents: 'none' },
  '.glean-h1': { fontSize: '1.7em', fontWeight: 700, display: 'inline-block' },

  '.glean-quote': { borderLeft: '3px solid rgba(180,140,80,0.25)', color: '#6a7a8a' },
  '.glean-table-widget': { borderCollapse: 'collapse', width: '100%', margin: '4px 0', fontSize: '0.95em' },

const state = EditorState.create({
  doc: testDoc,
  extensions: [
    markdown({ base: markdownLanguage }),
    history(),
    drawSelection(),
    highlightActiveLine(),
    highlightSelectionMatches(),
    indentUnit.of('  '),
    EditorState.tabSize.of(2),
    theme,
    livePreviewField,
    taskClickPlugin,
    keymap.of([...defaultKeymap, ...historyKeymap, ...markdownKeymap, indentWithTab]),
  ],
})

new EditorView({ state, parent: document.getElementById('editor') })
</script>
